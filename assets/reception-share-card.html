<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reception Invitation — Saharsh &amp; Shreya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Tiro+Devanagari+Hindi&display=block">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1200px;height:630px;overflow:hidden}
    body{
      position:relative;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(176deg,#F5E7E2 0%,#E8CDC8 56%,#D8B5B3 100%);
      color:#7A2433;font-family:'EB Garamond',Georgia,serif;
    }
    .mottle{position:absolute;inset:0;opacity:.4;
      background:
        radial-gradient(54% 44% at 50% 14%,#FFF5EF,transparent 72%),
        radial-gradient(40% 36% at 10% 74%,#DDB8B5,transparent 76%),
        radial-gradient(40% 36% at 90% 74%,#DDB8B5,transparent 76%)}
    .glow{position:absolute;left:50%;top:38%;width:760px;aspect-ratio:1;transform:translate(-50%,-50%);
      background:radial-gradient(circle,#FBECE6 0%,transparent 58%);opacity:.75}
    .corner{position:absolute;top:-34px;width:290px;height:auto;opacity:.97}
    .corner.l{left:-35px;transform:rotate(180deg)}
    .corner.r{right:-35px;transform:rotate(180deg) scaleX(-1)}
    .col{position:relative;z-index:2;text-align:center;width:850px}
    .deva{font-family:'Tiro Devanagari Hindi',serif;font-size:18px;line-height:1.5;letter-spacing:.01em}
    .halo{position:relative;display:table;line-height:0;margin:10px auto 12px}
    .halo::before{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;
      width:250%;aspect-ratio:1;border-radius:50%;z-index:-1;
      background:radial-gradient(circle,rgba(255,244,236,.95) 0%,rgba(244,215,207,.5) 36%,rgba(244,215,207,0) 68%)}
    .halo img{width:80px;display:block}
    .kicker{font-family:'Marcellus',serif;font-size:24px;line-height:1.3;letter-spacing:.16em;text-transform:uppercase}
    .names{font-family:'Pinyon Script',cursive;font-size:94px;line-height:1.15;padding-inline:.18em;margin-top:8px;white-space:nowrap}
    .names .and{font-family:'EB Garamond',serif;font-style:italic;font-size:40px;color:#8A8E6B;
      vertical-align:.3em;padding-inline:.5em;letter-spacing:.02em}
    .when{font-family:'Marcellus',serif;font-size:22px;line-height:1.4;letter-spacing:.09em;text-transform:uppercase;margin-top:18px}
    .where{font-family:'Marcellus',serif;color:#9A5862;font-size:18px;line-height:1.5;letter-spacing:.13em;text-transform:uppercase;margin-top:10px}
    .sprig{display:block;width:220px;height:auto;margin:20px auto 0}
  </style>
</head>
<body>
  <div class="mottle" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <img class="corner l" src="corner.webp" alt="">
  <img class="corner r" src="corner.webp" alt="">
  <main class="col">
    <p class="deva" lang="hi">॥ श्री गणेशाय नमः ॥</p>
    <span class="halo"><img src="ganesh.webp" alt="Lord Ganesha"></span>
    <p class="kicker">Reception Invitation</p>
    <h1 class="names">Saharsh<span class="and">&amp;</span>Shreya</h1>
    <p class="when">21 November 2026 &middot; 7:00 p.m.</p>
    <p class="where">Scorpio Club, Lucknow</p>
    <img class="sprig" src="sprig.webp" alt="">
  </main>
</body>
</html>
